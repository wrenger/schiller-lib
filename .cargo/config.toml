[alias]
serve-dev = [
    "run",
    "--",
    "--db=test/demo.json",
]
serve = [
    "run",
    "--",
    "127.0.0.1:5000",
    "--db=test/demo.json",
    "--cert=test/cert/cert.pem",
    "--key=test/cert/key.pem",
    "--auth=test/auth.json",
]

