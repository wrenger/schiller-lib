[package]
name = "schiller-lib"
description = "Schiller library software"
version = "0.11.0"
authors = ["Lars Wrenger <lars@wrenger.net>", "Nils Wrenger <nils@wrenger.net>"]
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/wrenger/schiller-lib"
publish = false
default-run = "schiller-lib"

[[bench]]
name = "benches"
harness = false

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "json",
    "query",
    "tokio",
    "tower-log",
    "tracing",
] }
axum-extra = { version = "0.12", features = ["typed-header"] }

hyper = "1.9"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "compression-deflate"] }
tower-service = "0.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.11.0", features = [
    "font-fontsource",
    "icon-iconify",
    "tailwind",
    "ui",
] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
email_address = "0.2"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
oauth2 = "5.0.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
roxmltree = "0.21"
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
nucleo-matcher = "0.3"

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }

[features]
default = []
sqlite = ["rusqlite"]
